name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Stamp the input version into package.json BEFORE `npm run make`.
      # Why this matters: electron-packager copies package.json into the
      # packaged app, and app.getVersion() reads from that copy at runtime.
      # Stamping here makes the status bar in the produced installer show
      # the release tag (e.g. v1.2.3 → "v1.2.3").
      #
      # The leading `v` is stripped because npm requires bare semver; the
      # renderer re-adds the `v` for display in StatusBar.tsx.
      #
      # `npm version` is preferred over hand-editing JSON: it keeps
      # package.json formatting consistent and updates package-lock.json's
      # root version in lock-step so a later `npm ci` (if any) won't fail.
      - name: Stamp release version into package.json
        run: |
          $raw = "${{ github.event.inputs.version }}"
          $semver = $raw -replace '^v', ''
          npm version $semver --no-git-tag-version --allow-same-version
          Write-Host "package.json version set to $semver"
        shell: pwsh

      - name: Install dependencies
        run: npm install

      - name: Build Electron app (Windows)
        run: npm run make

      - name: Find and rename installer
        run: |
          $exe = Get-ChildItem -Path .\out\make\squirrel.windows\x64\*.exe -ErrorAction Stop | Select-Object -First 1
          $newName = "AgentMaestroDesktop-${{ github.event.inputs.version }}.exe"
          Rename-Item $exe.FullName -NewName $newName
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.event.inputs.version }}
          tag_name: ${{ github.event.inputs.version }}
          files: out/make/squirrel.windows/x64/AgentMaestroDesktop-${{ github.event.inputs.version }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # macOS build. Must run on a macOS runner: darwin packaging/signing cannot be
  # produced on windows-latest, and `macos-latest` is the only image that ships
  # the toolchain Forge needs for `.app` bundles.
  #
  # `needs:` serialises the two jobs so the Windows job creates the release
  # first and this one only appends assets — running them concurrently makes
  # both jobs race to create the same tag (occasional HTTP 422 from the
  # releases API).
  build-macos:
    needs: build-and-release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Same version stamping as the Windows job — see the long comment there.
      # Without it the Info.plist / status bar would report 1.0.0 instead of
      # the release tag.
      - name: Stamp release version into package.json
        run: |
          semver="${{ github.event.inputs.version }}"
          npm version "${semver#v}" --no-git-tag-version --allow-same-version
          echo "package.json version set to ${semver#v}"

      - name: Install dependencies
        run: npm install

      # `--arch=universal` builds both arm64 and x86_64 and merges them with
      # @electron/universal (already a dependency of @electron/packager), so
      # Intel Macs are covered even though the runner itself is arm64.
      #
      # `MakerZIP` is already registered for darwin in forge.config.ts, so the
      # artifact below is a zip containing "Agent Maestro Desktop.app".
      - name: Build Electron app (macOS, universal)
        run: npx electron-forge make --platform=darwin --arch=universal

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: out/make/zip/darwin/universal/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
